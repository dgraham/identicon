name: Build
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: cargo build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: cargo check
      run: cargo check --all-targets
    - name: cargo build
      run: cargo build
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: cargo test
      run: cargo test
  lint:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: cargo fmt
      run: cargo fmt --all --check
    - name: cargo clippy
      run: cargo clippy --all-targets
